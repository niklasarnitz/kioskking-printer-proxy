services:
  printer-proxy:
    image: nginx:1.27-alpine
    container_name: kioskking-printer-proxy
    network_mode: host
    restart: unless-stopped
    environment:
      CUPS_PORT: "${CUPS_PORT:-631}"
      ALLOWED_ORIGIN_LOCAL: "${ALLOWED_ORIGIN_LOCAL:-http://localhost:3000}"
      ALLOWED_ORIGIN_PRODUCTION: "${ALLOWED_ORIGIN_PRODUCTION:-https://kioskking.arnitz.org}"
    volumes:
      - ./nginx/templates/linux.conf.template:/etc/nginx/templates/default.conf.template:ro
